# Every secret pixel-phone keeps in Azure Key Vault. NAMES AND METADATA ONLY: never a value.
#
# The single source of truth for which secrets exist, what each is called in Key Vault,
# which environment variable carries it, and when a stack needs it (Pixel ADR 0015). Read by:
#   - infra/modules/pixel-phone/locals.tf  (which secrets the Container App references)
#   - scripts/secrets-manifest.ts          (validation, and just secrets-pull / secrets-push)
#   - tests/scripts/secrets-manifest.test.ts, which fails when this file, .env.example,
#     src/config.ts, the Terraform features or the runbook disagree.
#
# To add a secret: add an entry here, add the setting to .env.example (and src/config.ts),
# and describe it in docs/runbook.md. The test names whatever you missed.
#
# Only just secrets-push writes these values (Pixel ADR 0017). Terraform references them
# from the Container App but never writes or reads them, so they never reach state.

version: 1

# A feature decides whether a stack needs the secret. Terraform maps each name to a
# condition in `secret_features` (infra/modules/pixel-phone/locals.tf). Turn a feature
# on only after its secrets are in Key Vault: the Container App can't start a revision
# that references a missing secret.
features:
  telnyx: Telnyx Call Control (telnyx_enabled)
  home-assistant: Ringing the space through Home Assistant (home_assistant_url is set)
  accept-api: The accept API for Home Assistant and Pixel (accept_api_enabled)
  sentry: Sentry error reporting (sentry_enabled)

secrets:
  - vault: telnyx-api-key
    env: TELNYX_API_KEY
    feature: telnyx
    description: A Telnyx API key for Call Control commands on this environment's application.

  - vault: telnyx-public-key
    env: TELNYX_PUBLIC_KEY
    feature: telnyx
    description: The Telnyx account's Ed25519 public key, for checking webhook signatures. Kept next to the API key so they rotate together.

  - vault: home-assistant-token
    env: HOME_ASSISTANT_TOKEN
    feature: home-assistant
    description: A long-lived access token from a non-admin Home Assistant user that may only flip the ringing helper.

  - vault: api-keys-yaml
    env: API_KEYS_YAML
    feature: accept-api
    description: The accept API's callers as YAML, a list of id and key (home-assistant, pixel).

  - vault: sentry-dsn
    env: SENTRY_DSN
    feature: sentry
    description: The Sentry project's DSN.
