name: CD

# Merges to main publish ghcr.io/pixelbar/pixel-phone:<sha> and :main, and a Sentry
# release when Sentry is configured. This workflow never logs in to Azure: dev is
# rolled by Deploy dev (or `just deploy dev`), prod by the Release workflow (#20).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

  publish:
    name: Publish GHCR
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            PIXEL_PHONE_VERSION=${{ github.sha }}
            PIXEL_PHONE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains an env file
        env:
          PIN: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env || ls /app/.env.* >/dev/null 2>&1'; then
            echo "::error::Image ${PIN} contains an env file. Do not deploy it."
            exit 1
          fi
          echo "No env files in ${PIN}."

      - name: Make the GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH -H "Accept: application/vnd.github+json" "${package}" -f visibility=public; then
              echo "Package is public."
              exit 0
            fi
            echo "Visibility update failed (attempt ${attempt})."
            sleep 5
          done
          echo "::warning::Could not make ghcr.io/${{ github.repository }} public. A maintainer must: GitHub → Packages → pixel-phone → Package settings → Change visibility → Public. Until then Azure can't pull it."

  sentry-release:
    name: Sentry release (source maps)
    needs: publish
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      # Unlike Pixel, which fails closed here, pixel-phone's Sentry project doesn't exist
      # yet. Until a maintainer sets SENTRY_AUTH_TOKEN (secret), SENTRY_ORG and
      # SENTRY_PROJECT (variables), the release is skipped with a warning.
      - name: Check Sentry is configured
        id: configured
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "::warning::Sentry isn't configured for this repository (SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT), so no release or source maps were uploaded."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.configured.outputs.ok == 'true' }}
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: ${{ steps.configured.outputs.ok == 'true' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.configured.outputs.ok == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build and upload source maps
        if: ${{ steps.configured.outputs.ok == 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p tsconfig.build.json
          npx --yes @sentry/cli@2.58.2 releases new "${GITHUB_SHA}"
          npx --yes @sentry/cli@2.58.2 sourcemaps upload --release "${GITHUB_SHA}" --url-prefix "/app/dist" dist
          npx --yes @sentry/cli@2.58.2 releases finalize "${GITHUB_SHA}"
